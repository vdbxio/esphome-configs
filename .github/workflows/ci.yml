# Validate that ESPHome configs compile on PRs and nightly.
# Does not flash hardware or publish firmware — compile-only smoke test.

name: CI

on:
  pull_request:
    paths:
      - '*.yaml'                    # Only run when configs change
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 0 * * *'             # Midnight UTC — catch ESPHome "latest" breakage

concurrency:
  # One run per PR; cancel outdated commits on the same PR
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Nightly only: skip the builds when neither ESPHome nor the configs changed
  # since the last green nightly run. PRs always build.
  check:
    name: Check for ESPHome or config changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      key: ${{ steps.key.outputs.key }}
      version: ${{ steps.key.outputs.version }}
    steps:
      - name: Checkout source code
        if: github.event_name == 'schedule'
        uses: actions/checkout@v6

      - name: Latest ESPHome version
        id: key
        if: github.event_name == 'schedule'
        run: |
          if version=$(curl -fsSL https://pypi.org/pypi/esphome/json | jq -er .info.version); then
            echo "ESPHome latest: $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "key=nightly-ok-${version}-${{ hashFiles('**/*.yaml', '.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"
          else
            # PyPI lookup failed: use a one-off key so this run builds "latest" instead of skipping
            echo "::warning::Could not look up the latest ESPHome version; building anyway"
            echo "key=nightly-unknown-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Look for a green build of this version
        id: seen
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .nightly-ok
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "${{ steps.seen.outputs.cache-hit }}" = true ]; then
            echo "Nothing changed since the last green nightly build; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Building ${{ matrix.file }} / ${{ matrix.esphome-version }}
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # Keep building other matrix legs if one yaml fails
      max-parallel: 3    # Cap concurrent compiles (ESPHome builds are heavy)
      matrix:
        #### Modify below here to match your project ####
        # Stem only — .yaml appended in build step below
        file:
          - flip-c3.factory     # Factory firmware (web installer, qaset)
          - flip-c3.import      # Dashboard adopt template (github packages)
          - pwrtool500.factory   # Factory firmware (managed OTA, qaset)
          - pwrtool500.import    # Dashboard adopt template (no manifest OTA)
        #### Modify above here to match your project ####

        esphome-version:
          - latest               # Floats to newest ESPHome on each run
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      # import.yaml files use !secret wifi_ssid / wifi_password — not available in CI
      - name: Stub secrets for import YAML
        run: |
          printf '%s\n' 'wifi_ssid: "ci"' 'wifi_password: "cipassword"' > secrets.yaml

      - name: ESPHome ${{ matrix.esphome-version }}
        uses: esphome/build-action@v7.3.0
        with:
          yaml-file: ${{ matrix.file }}.yaml  # e.g. pwrtool500.factory.yaml
          # Nightly builds the exact version the skip check looked up, so the green marker matches what was built
          version: ${{ needs.check.outputs.version || matrix.esphome-version }}

  # Remember this ESPHome version + config set as green, so tomorrow's nightly can skip
  mark-green:
    name: Mark nightly build green
    needs: [check, ci]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: echo ok > .nightly-ok
      - uses: actions/cache/save@v4
        with:
          path: .nightly-ok
          key: ${{ needs.check.outputs.key }}
